name: Refresh STS2 data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: sts2-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Refresh pinned Spire Archive snapshot
        run: node scripts/update-data.mjs

      - name: Detect upstream changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/sts2; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate refreshed graph
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build:site
          npm run check
          node scripts/build-vault.mjs --output "$RUNNER_TEMP/sts2-vault"

      - name: Open data refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/sts2-data-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/sts2 index.html
          git commit -m "Refresh pinned STS2 data snapshot"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh pinned STS2 data snapshot" \
            --body "Automated upstream snapshot refresh. Validation and vault generation passed. Review game-text changes for semantic-rule adjustments before merging."
          # GITHUB_TOKEN events do not start push/pull_request workflows.
          # workflow_dispatch is the supported exception; run the same required
          # checks on this exact refresh branch without adding credentials.
          gh workflow run validate.yml --ref "$BRANCH"
