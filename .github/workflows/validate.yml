name: Validate graph

on:
  push:
    branches:
      - main
      - feat/sts2-graph-clean
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax, emitted graph semantics, and website/vault parity
        run: npm run check
      - name: Build standalone preview
        run: npm run build:preview
      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: sts2-bubble-preview
          path: dist/sts2-bubble-preview.html
          if-no-files-found: error
      - name: Build Obsidian vault
        run: node scripts/build-vault.mjs
      - name: Verify generated vault
        run: |
          test -f "vault/Start Here.md"
          test -f "vault/README.md"
          test "$(find vault -type f -name '*.md' | wc -l)" -gt 500
      - name: Upload Obsidian vault
        uses: actions/upload-artifact@v4
        with:
          name: sts2-bubble-obsidian-vault
          path: vault/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check styled previews, directed connections, keyboard navigation, filters, and mobile behavior
        run: npm run test:browser
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
