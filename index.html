<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>
    <style>
        /* Removes default edge gaps around the screen */
        body {
            margin: 0;
            padding: 0;
        }

        /* Makes the image stretch across the full width of the screen */
        .responsive-img {
            width: 100%;
            height: auto; /* Maintains the original aspect ratio */
            display: block; /* Removes any extra bottom alignment spacing */
        }
    </style>
</head>
<body>

    <a href="https://example.com" target="_blank">
        <img src="sts2-neow.webp" alt="STS2-NEOW" class="responsive-img"/>
    </a>

</body>
</html>
